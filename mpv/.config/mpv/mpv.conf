# --- ModernZ / OSC ---
osc=no
title-bar=no

# --- Window behavior ---
# Force the video to open at a reasonable size instead of native res
geometry=70%x70%
autofit-larger=100%x100%
ontop=yes

# --- GPU / video output ---
vo=gpu-next
gpu-api=vulkan
hwdec=vaapi
hwdec-codecs=all
gpu-dumb-mode=no

# --- Scaling (quality-focused, still fine on Intel iGPU for 1080p anime) ---
scale=ewa_lanczossharp
cscale=spline36
dscale=hermite
linear-downscaling=yes
correct-downscaling=yes
sigmoid-upscaling=yes

# --- Anti-ringing (fixes halos from sharp scalers like ewa_lanczossharp) ---
scale-antiring=0.6
cscale-antiring=0.6s

# --- Dithering ---
dither-depth=auto
dither=fruit

# --- Timing ---
correct-pts=yes

# --- Subs --- 
sub-file-paths=sub:subtitles:Subs
sub-auto=fuzzy

# --- Audio ---
audio-file-auto=fuzzy

# --- Screenshots ---
screenshot-format=png
screenshot-png-compression=8
screenshot-directory=~/Pictures/Screenshots
screenshot-template="%f-%wH.%wM.%wS.%wT"

# --- Playback behavior ---
keep-open=yes
save-position-on-quit=yes
# Resume where you left off automatically
watch-later-directory=~/.config/mpv/watch_later
# Keep ModernZ's temporary subtitle lift out of resume state
watch-later-options-remove=sub-pos

# --- Cache ---
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB

# --- Misc quality of life ---
force-window=yes
osd-font-size=32


