filetype: kdl

detect:
    filename: "\\.kdl$"

rules:
    # Node names at the start of a line (optionally after slashdash or type annotation)
    - statement: "^\\s*(?:\\/-\\s*)?(?:\\([^)]+\\)\\s*)?[a-zA-Z_][a-zA-Z0-9_.-]*"

    # Properties (key=value)
    - identifier: "[a-zA-Z_][a-zA-Z0-9_.-]*="

    # Booleans, null, and special float keywords (KDL v1 & v2)
    - constant.bool: "(^|\\s|=)(#?(true|false|null)|#(inf|-inf|nan))\\b"

    # Numbers (hex, octal, binary, decimal/float with optional underscores)
    - constant.number: "(^|\\s|=)[+-]?(0x[0-9a-fA-F][0-9a-fA-F_]*|0o[0-7][0-7_]*|0b[01][01_]*|[0-9][0-9_]*(\\.[0-9][0-9_]*)?([eE][+-]?[0-9][0-9_]*)?)\\b"

    # Symbols and operators (after identifier/bool/number so '=' keeps symbol color)
    - symbol.brackets: "(\\{|\\}|\\(|\\))"
    - symbol.operator: "(=|;|\\\\$)"

    # Type annotations e.g. (u8), (date)
    - type: "\\([a-zA-Z0-9_.-]+\\)"

    # Slashdash comment marker
    - comment: "/-"

    # Multiline strings (KDL v2)
    - constant.string:
        start: "\"\"\""
        end: "\"\"\""
        skip: "\\\\."

    # Raw strings (KDL v1 & v2)
    - constant.string:
        start: "(r#+\"|#+\")"
        end: "\"#+"

    - constant.string:
        start: "r\""
        end: "\""

    # Standard double-quoted strings
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\([nrt\\\\\"bf]|u\\{[0-9a-fA-F]+\\})"

    # Line comments
    - comment:
        start: "//"
        end: "$"
        rules:
            - todo: "(TODO|XXX|FIXME):?"

    # Block comments
    - comment:
        start: "/\\*"
        end: "\\*/"
        rules:
            - todo: "(TODO|XXX|FIXME):?"
