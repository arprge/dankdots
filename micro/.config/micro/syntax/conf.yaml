filetype: conf

detect:
    filename: "\\.(conf|cfg|cnf|ini|service|timer|socket)$"
    header: "^\\s*\\[[^\\]]+\\]\\s*$"

rules:
    - type: "^\\s*\\[[^\\]]+\\]"
    - identifier: "^\\s*[a-zA-Z0-9_.-]+"
    - preproc: "^\\s*(map|mouse_map|include|globinclude|envinclude|env|action_alias|kitten_alias|server|location|http|events)\\b"
    - special: "\\b(kitty_mod|ctrl|shift|alt|super|cmd|opt)\\b"
    - symbol: "(=|:|;|\\{|\\})"
    - constant.specialChar: "#[0-9a-fA-F]{3,8}\\b"
    - constant.string: "(https?://[^\\s\"';]+|(\\s|=|:|^)(~|\\.{1,2})?/[^\\s\"';]+)"
    - constant.bool: "(?i)\\b(yes|no|true|false|on|off|auto|none|block|beam|underline|hollow)\\b"
    - constant.number: "\\b-?[0-9]+(\\.[0-9]+)?(px|pt|em|rem|ms|s|m|h|d|k|K|M|G|T|%)?\\b"
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
    - constant.string:
        start: "'"
        end: "'"
        skip: "\\\\."
    - comment:
        start: "(^|\\s)(#|;)"
        end: "$"
