[preview]
max_width = 1600
max_height = 1600
image_quality = 90

[opener]
micro = [
	{ run = 'micro %s', block = true, desc = "micro" },
]

# Include notepad
notepad = [
	{ run = 'for f in %s; do dms ipc call notepad openFile "$f"; done', desc = "DMS Notepad", orphan = true },
]

[open]
prepend_rules = [
	{ mime = "text/*", use = [ "micro", "notepad", "edit" ] },
	{ mime = "application/{json,ndjson,xml,yaml,toml,javascript,x-shellscript,wine-extension-ini}", use = [ "micro", "notepad", "edit" ] },
	{ mime = "inode/empty", use = [ "micro", "notepad", "edit" ] },
]

