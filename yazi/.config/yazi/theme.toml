# Yazi theme overrides.
#
# Two things are added on top of yazi's built-in defaults:
#   1. Image files are colored ANSI "lightblue" instead of the default "yellow".
#   2. Extra icons (see [icon] at the bottom) for home directories and a few
#      file types that the bundled nvim-web-devicons set doesn't cover.
# Everything else is intentionally left to yazi's built-in defaults, which use
# ANSI color *names* ("cyan", "blue", ...).
# Those names resolve to kitty's 16-color palette, and kitty's palette is
# regenerated from the wallpaper by DMS/matugen (~/.config/kitty/dank-theme.conf).
# So: the whole UI keeps following matugen, and so does the image color below.
#
# NOTE: [filetype].rules is NOT merged with the defaults -- assigning `rules`
# replaces the entire default list (yazi's Filetype struct has no
# prepend_rules/append_rules, unlike [icon]). The complete default list is
# therefore reproduced below, with only the image rule changed.
#
# To use a different accent, swap "cyan" on the image rule for any of:
#   black color0  red color1    green color2   yellow color3
#   blue  color4  magenta color5 cyan color6   white* color7
#   light* color8-15  (lightgreen, lightcyan, lightyellow, ...)  gray / darkgray
# (*"white" and the "light*" names do not exist as base names here; valid
#  names are the 17 listed in yazi's docs: black, white, red, lightred, green,
#  lightgreen, yellow, lightyellow, blue, lightblue, magenta, lightmagenta,
#  cyan, lightcyan, gray, darkgray, reset.)

[filetype]
rules = [
	# Image  -
	{ mime = "**/image/*", fg = "lightblue" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "magenta" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "red" },
	# Document
	{ mime = "**/application/{pdf,doc,docx,rtf,pptx}", fg = "cyan" },
	# Virtual file system (default is "gray" in dark mode, "darkgray" in light mode;
	# rules can't be conditional on light/dark, so "gray" is kept here)
	{ mime = "vfs/{absent,stale}", fg = "gray" },
	# Special file
	{ url = "*", is = "orphan", bg = "red" },
	{ url = "*", is = "exec"  , fg = "green" },
	# Dummy file
	{ url = "*", is = "dummy", bg = "red" },
	{ url = "*/", is = "dummy", bg = "red" },
	# Fallback
	{ url = "*/", fg = "blue" }
]

# Extra icons, appended to yazi's built-in nvim-web-devicons set.
# `append_*` never overrides an existing built-in entry, so these only fill
# gaps. Icon colors are either Nerd Font brand colors or ANSI names so the
# home-directory icons keep following the matugen palette.
